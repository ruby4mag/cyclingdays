# CycleDays dashboard under /cyclingdays/ behind nginx.
#
# Rocky/RHEL: copy to /etc/nginx/default.d/cyclingdays.conf. The server
# HTTPS server in conf.d/cyclingdays-tls.conf includes that directory
# (`include /etc/nginx/default.d/*.conf;`), or paste the location blocks into
# your own `server { ... }` block. Then:
#   setsebool -P httpd_can_network_connect 1   # SELinux: let nginx reach 127.0.0.1:8010
#   nginx -t && systemctl reload nginx
#
# Sign-in is done by the app (see docs/DASHBOARD.md, "Login"): create a user
# with `python -m scripts.manage_users add <name>` in the app container.
# Served over HTTPS by the server in cyclingdays-tls.conf (which includes
# default.d); the app's .env has AUTH_COOKIE_SECURE=true.

location = /cyclingdays { return 301 /cyclingdays/; }

# Login and logout forms (GET shows the form, POST submits it).
location ~ ^/cyclingdays/(login|logout)$ {
    limit_except GET POST { deny all; }
    client_max_body_size 8k;

    rewrite ^/cyclingdays/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# The dashboard page, its static files and its read-only JSON API. The app
# answers 401 (or redirects to the login page) without a valid session.
location ~ ^/cyclingdays/(dashboard|static/[A-Za-z0-9._-]+|api/dashboard/[a-z]+|api/session)?$ {
    limit_except GET { deny all; }

    rewrite ^/cyclingdays/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Phase 10: the Account page (onboarding and settings) and its JSON API.
# Writes are same-origin JSON only (checked by the app); bodies are small.
location ~ ^/cyclingdays/(account|api/account(/intervals|/profile|/goal|/goal/preview|/notifications)?)$ {
    limit_except GET POST PUT DELETE { deny all; }
    client_max_body_size 16k;

    rewrite ^/cyclingdays/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Connecting Intervals.icu waits for its API (with retries).
    proxy_read_timeout 60s;
}

# Everything else under the prefix (/docs, /health, other APIs) stays private.
location /cyclingdays/ { return 404; }
