# HTTPS for cyclingdays.in (Let's Encrypt), installed as
# /etc/nginx/conf.d/cyclingdays-tls.conf.
#
# Certificate (port-80 validation, renewed automatically by certbot-renew.timer):
#   certbot certonly --nginx -d cyclingdays.in -d www.cyclingdays.in \
#     --register-unsafely-without-email --agree-tos
# nginx is reloaded after each renewal by
#   /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
#
# The app locations (/cyclingdays, the / redirect) come from default.d/*.conf.
# The app's .env must have AUTH_COOKIE_SECURE=true: the session cookie is then
# only sent over HTTPS.

# Plain HTTP for the domain: everything moves to HTTPS. (certbot's nginx
# authenticator adds its own temporary challenge location during renewals.)
server {
    listen 80;
    listen [::]:80;
    server_name cyclingdays.in www.cyclingdays.in;
    return 301 https://cyclingdays.in$request_uri;
}

# www → apex, so there's one origin (and one session cookie).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cyclingdays.in;

    ssl_certificate     /etc/letsencrypt/live/cyclingdays.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyclingdays.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cyclingdays.in$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name cyclingdays.in;

    ssl_certificate     /etc/letsencrypt/live/cyclingdays.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyclingdays.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Browsers use HTTPS only for 30 days after a visit (subdomains not included).
    add_header Strict-Transport-Security "max-age=2592000" always;

    # CycleDays: /, /cyclingdays and its locations.
    include /etc/nginx/default.d/*.conf;

    # Grafana, as on the plain-HTTP server (conf.d/grafana.conf).
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
