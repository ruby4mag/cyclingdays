# Send the bare host (http://<server>/) to the CycleDays dashboard.
# Exact match only: /grafana and every other path are unaffected.
# 302 (not 301) so browsers don't cache it forever if the root changes later.
#
# Install next to cyclingdays.conf: /etc/nginx/default.d/root-redirect.conf
location = / { return 302 /cyclingdays/; }
